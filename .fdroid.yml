Summary: Self-custody wallet with multi-network portfolio and market tools
Description: |
  A self-custody wallet for managing on-chain assets, viewing live market
  information, and preparing wallet-authorized transactions.

  Private keys and recovery phrases are encrypted and kept on the user's
  device. Network features use public blockchain RPC endpoints and published
  service APIs.

  Live market data and connected services require network access to their
  respective providers.
